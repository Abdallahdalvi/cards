version: '3.8'

services:
  dalvicard:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://supabase.dalvi.cloud}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: dalvicard_web
    ports:
      - "8099:80"
    restart: unless-stopped
    depends_on:
      - dalvicard_api

  dalvicard_api:
    build:
      context: ./server
    container_name: dalvicard_api
    ports:
      - "3001:3001"
    environment:
      - VITE_OPENROUTER_KEY=${VITE_OPENROUTER_KEY}
    restart: unless-stopped
